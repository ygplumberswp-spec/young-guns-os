# Canonical deploy config also lives at /apps/web/railway.toml (preferred Config-as-code path).

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.web"
watchPatterns = [
  "/apps/web/**",
  "/packages/shared/**",
  "/packages/auth/**",
  "/packages/ui/**",
  "infra/docker/Dockerfile.web",
  "/infra/docker/nginx.web.conf",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/package.json",
]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
