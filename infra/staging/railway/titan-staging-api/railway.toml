# Canonical deploy config also lives at /apps/api/railway.toml (preferred Config-as-code path).
# Keep this file in sync for staging documentation under infra/staging/railway/.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.api"
watchPatterns = [
  "/apps/api/**",
  "/packages/shared/**",
  "/packages/auth/**",
  "/packages/db/**",
  "/packages/aura/**",
  "infra/docker/Dockerfile.api",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/package.json",
]

[deploy]
healthcheckPath = "/api/v1/health/ready"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
