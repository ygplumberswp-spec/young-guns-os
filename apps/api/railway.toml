# TITAN API — Railway config-as-code (package root).
# Set service Config-as-code path to: /apps/api/railway.toml
# Root Directory must remain empty (/) so Docker build context is the monorepo root.
# Dockerfile is NOT named "Dockerfile", so builder + absolute dockerfilePath are required.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.api"
watchPatterns = [
  "/apps/api/**",
  "/packages/shared/**",
  "/packages/auth/**",
  "/packages/db/**",
  "/packages/aura/**",
  "infra/docker/Dockerfile.api",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/package.json",
]

[deploy]
healthcheckPath = "/api/v1/health/ready"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
