<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/titan-mobile-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>TITAN — AI Business Operating System</title>
    <meta name="titan-env" content="%VITE_APP_ENV%" />
  </head>
  <body data-titan-env="%VITE_APP_ENV%">
    <div id="root"></div>
    <!-- Optional runtime override (Railway nginx may force same-origin API base). -->
    <script>window.__TITAN_API_BASE__="";</script>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
