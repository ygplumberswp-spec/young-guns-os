# TITAN Web — Railway config-as-code (package root).
# Set service Config-as-code path to: /apps/web/railway.toml
# Root Directory must remain empty (/) so Docker build context is the monorepo root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.web"
watchPatterns = [
  "/apps/web/**",
  "/packages/shared/**",
  "/packages/auth/**",
  "/packages/ui/**",
  "infra/docker/Dockerfile.web",
  "/infra/docker/nginx.web.conf",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/package.json",
]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
